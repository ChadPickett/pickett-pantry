<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b56b0">
<meta name="description" content="Pickett family recipe box, meal planner and grocery list.">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/firebase-config.js"></script>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Pickett Pantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: a phone-first recipe box. Sticky title bar, one scrolling column, fixed bottom tab bar with a raised add button.
   Recipe tiles without photos are drawn as ruled index cards (red header rule, blue lines, handwritten title). */
:root{
  --paper:#f7f8f5; --card:#ffffff; --ink:#1d2330; --muted:#636a78; --line:#e2e4dc;
  --rule-blue:#cdd9ef; --rule-red:#d4473f; --accent:#2b56b0; --accent-soft:#e6edfa; --on-accent:#ffffff;
  --herb:#2f7a4c; --herb-soft:#e3f1e8; --warn:#a1620f; --shade:rgba(20,24,35,.45);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12151b; --card:#1b1f27; --ink:#e8eaef; --muted:#9aa1ae; --line:#2b303b;
  --rule-blue:#27344e; --rule-red:#e2685f; --accent:#86a7ee; --accent-soft:#1f2b45; --on-accent:#0e1422;
  --herb:#72c08f; --herb-soft:#1b3326; --warn:#e0a54a; --shade:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#12151b; --card:#1b1f27; --ink:#e8eaef; --muted:#9aa1ae; --line:#2b303b;
  --rule-blue:#27344e; --rule-red:#e2685f; --accent:#86a7ee; --accent-soft:#1f2b45; --on-accent:#0e1422;
  --herb:#72c08f; --herb-soft:#1b3326; --warn:#e0a54a; --shade:rgba(0,0,0,.6); color-scheme:dark }

html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
html.locked body{overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
a{color:var(--accent)}
.app{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.top h1{font-size:1.75rem;font-weight:800;flex:1;min-width:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.95rem;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--rule-red)}
.btn.small{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;flex:none}
.icon-btn svg,.btn svg{width:20px;height:20px}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* inputs */
.field{display:grid;gap:6px}
.field label,.lbl{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;min-height:44px}
textarea.inp{min-height:120px;resize:vertical;line-height:1.45}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:44px}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:none;min-height:42px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}

/* recipe grid */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;color:var(--muted);font-size:.9rem}
.toolbar select{border:0;background:transparent;font-weight:700;color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.rcard{display:grid;gap:8px;text-align:left;border:0;background:none;padding:0;min-width:0}
.thumb{aspect-ratio:4/3.1;width:100%;max-width:100%;border-radius:var(--r);overflow:hidden;position:relative;background:var(--card);border:1px solid var(--line)}
.thumb img,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--card)}
.indexcard{position:absolute;inset:0;background:
  linear-gradient(var(--card),var(--card)) top/100% 30% no-repeat,
  repeating-linear-gradient(to bottom, transparent 0 21px, var(--rule-blue) 21px 22px) 0 30%/100% 70% no-repeat, var(--card);
  display:flex;flex-direction:column;padding:10px 12px}
.indexcard::before{content:"";position:absolute;left:0;right:0;top:30%;height:2px;background:var(--rule-red);opacity:.85}
.indexcard .hand{font-family:var(--hand);font-weight:700;font-size:1.45rem;line-height:1.05;color:var(--accent);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.indexcard .no{position:absolute;right:10px;bottom:6px;font-family:var(--hand);color:var(--muted);font-size:1rem}
.rcard .t{font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .m{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.badge{position:absolute;bottom:8px;left:8px;background:var(--ink);color:var(--paper);font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px}

/* empty + banners */
.empty{text-align:center;padding:48px 20px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h2{color:var(--ink);font-size:1.3rem}
.empty .card-art{width:150px;height:96px;position:relative;border-radius:10px;border:1px solid var(--line);overflow:hidden;transform:rotate(-3deg);margin-bottom:6px}
.banner{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start;margin-block:8px}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);padding:6px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.fab{justify-self:center;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.fab svg{width:28px;height:28px;stroke-width:2.4}

/* full-screen overlay */
.ov{position:fixed;inset:0;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-in{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.ov-bar{position:sticky;top:0;z-index:3;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:10px}
.ov-bar .ttl{flex:1;min-width:0;font-weight:700;font-family:var(--display);font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);justify-self:center;margin-bottom:2px}
.sheet h2{font-size:1.3rem}
.opt{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;width:100%}
.opt .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.opt b{display:block}
.opt span{color:var(--muted);font-size:.88rem}
.list{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-height:52px}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;background:var(--card)}
.check.on{background:var(--herb);border-color:var(--herb);color:#fff}
.check svg{width:16px;height:16px;stroke-width:3}

/* recipe detail */
.hero{border-radius:20px;overflow:hidden;position:relative;aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);background:var(--card)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .indexcard{padding:22px 24px}
.hero .indexcard .hand{font-size:2.6rem;-webkit-line-clamp:2}
.rtitle{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800;line-height:1.08;margin-top:16px}
.src{font-size:.9rem;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-block:16px;font-variant-numeric:tabular-nums}
.stats div{padding:10px 8px;text-align:center;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:1.02rem}
.stats span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 4px;display:grid;justify-items:center;gap:4px;font-size:.78rem;font-weight:700}
.act svg{width:22px;height:22px;color:var(--accent)}
.cookbtn{width:100%;margin-top:12px;min-height:52px;font-size:1.05rem}
.sec{margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.stepper button{border:0;background:none;width:38px;height:36px;font-size:1.2rem;font-weight:700}
.stepper span{min-width:92px;text-align:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.82rem;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.ings{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-blue)}
.ings li{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--rule-blue)}
.ings li.h{font-family:var(--display);font-weight:700;padding-top:18px;border-bottom-color:var(--rule-red)}
.ings li.done .txt{color:var(--muted);text-decoration:line-through}
.ings .check{margin-top:1px;padding:0}
.ings b{font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:16px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:800;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.steps li.h{grid-template-columns:1fr;font-family:var(--display);font-weight:700;margin-top:6px}
.steps li.h::before{display:none}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-variant-numeric:tabular-nums}
.nutri div{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;text-align:center}
.nutri b{display:block;font-size:1.15rem;font-family:var(--display)}
.nutri span{font-size:.75rem;color:var(--muted)}
.note-box{font-family:var(--hand);font-size:1.4rem;line-height:1.25;color:var(--accent);background:repeating-linear-gradient(to bottom,transparent 0 29px,var(--rule-blue) 29px 30px),var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px 10px;white-space:pre-wrap}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:2px;color:var(--line)}
.stars button.on{color:#e3a019}
.stars svg{width:24px;height:24px;fill:currentColor;stroke:none}
.mini-stars{color:#e3a019;letter-spacing:1px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:.78rem;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px}

/* meal plan */
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block:4px 12px}
.week-nav b{font-family:var(--display);font-size:1.05rem;text-align:center;flex:1}
.day{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.day.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.day-h{display:flex;align-items:baseline;gap:10px}
.day-h b{font-family:var(--display);font-size:1.1rem}
.day-h span{color:var(--muted);font-size:.88rem;flex:1}
.meal{display:flex;gap:10px;align-items:center;border:0;background:var(--paper);border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.meal .mt{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:72px;flex:none}
.meal .mn{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .mn.note{font-weight:400;font-style:italic}
.days{display:grid;gap:10px}

/* groceries */
.addbar{display:flex;gap:8px;align-items:flex-end}
.addbar textarea{min-height:46px;height:46px;flex:1;resize:none}
.aisle-h{display:flex;justify-content:space-between;margin:18px 2px 6px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.gi .name{font-weight:700}
.gi .sub{font-size:.82rem;color:var(--muted)}
.gi.done .name{text-decoration:line-through;color:var(--muted);font-weight:400}
.qty{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;white-space:nowrap}

/* cook mode */
.cook{display:flex;flex-direction:column;min-height:100%}
.cook .prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.cook .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.cook .stepno{font-family:var(--display);color:var(--accent);font-weight:800;font-size:1.1rem;margin-top:22px}
.cook .steptext{font-size:clamp(1.3rem,4.6vw,1.8rem);line-height:1.4;margin-top:10px;flex:1}
.cook .navbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding-block:18px}
.cook .navbtns .btn{min-height:56px;font-size:1.05rem;border-radius:16px}

/* chat */
.msgs{display:grid;gap:12px;padding-block:8px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.ai{justify-self:start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.chatbar{position:sticky;bottom:0;background:var(--paper);padding-block:10px;display:flex;gap:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.92rem;z-index:999;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.5s}.cook .prog i{transition:none}}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){ .actions{grid-template-columns:repeat(4,1fr)} .act{font-size:.7rem} .stats b{font-size:.92rem} .nutri{grid-template-columns:repeat(2,1fr)} }
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;display:grid;gap:14px;text-align:center}
.login-card .card-art{width:190px;height:120px;margin:0 auto 6px;position:relative;border-radius:12px;border:1px solid var(--line);overflow:hidden;transform:rotate(-3deg)}
.login-card h1{font-size:2rem}
.login-card .inp{text-align:center;font-size:1.1rem}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";

/* ---------------- icons (original line art) ---------------- */
const I = {
  book:'<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 7h8"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h3M8 17h6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  basket:'<svg viewBox="0 0 24 24"><path d="M3 9h18l-2 11H5z"/><path d="M8 9l3-6M16 9l-3-6"/><path d="M9 13v4M15 13v4"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',

const NUMRE = '(\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d*\\.\\d+|\\d+)';
const QRE = new RegExp('^' + NUMRE + '(?:\\s*(?:-|–|to)\\s*' + NUMRE + ')?\\s*');

function parseLine(raw){
  const s = String(raw || '').trim();
  if (!s) return null;
  if (/^#+\s*/.test(s)) return { heading: s.replace(/^#+\s*/, '').replace(/:$/, '') };
  if (/:$/.test(s) && !/\d/.test(s.slice(0, 1)) && s.length < 60) return { heading: s.replace(/:$/, '') };
  let t = s.replace(/^[-•*▢□]\s*/, '');
  t = t.replace(/(\d*)\s*([½⅓⅔¼¾⅛⅜⅝⅞⅕⅖⅗⅘⅙⅚])/g, (m, d, f) => ' ' + String(Math.round(((d ? +d : 0) + UFR[f]) * 10000) / 10000) + ' ').trim();
  let qty = null, qty2 = null, unit = null, rest = t;
  const m = t.match(QRE);
  if (m) { qty = toNum(m[1]); if (m[2]) qty2 = toNum(m[2]); rest = t.slice(m[0].length); }
  rest = rest.replace(/^x\s+/i, '');
  let size = '';
  if (qty != null) {
    const pm = rest.match(/^\(([^)]{1,30})\)\s*/);
    if (pm) { const after = rest.slice(pm[0].length); if (ALIASES.some(([a]) => after.toLowerCase().startsWith(a.toLowerCase() + ' ') && a.length > 1)) { size = pm[1]; rest = after; } }
    for (const [a, c] of ALIASES) {
      const caseSens = (a === 't' || a === 'T');
      const head = rest.slice(0, a.length);
      if ((caseSens ? head === a : head.toLowerCase() === a.toLowerCase()) && /^($|[\s.,)])/.test(rest.slice(a.length))) {

  }
  const ci = rest.indexOf(',');
  const item = (ci > 0 ? rest.slice(0, ci) : rest).trim();
  let note = ci > 0 ? rest.slice(ci + 1).trim() : '';
  if (size) note = size + (note ? ', ' + note : '');
  return { text: s, qty, qty2, unit, item, note };
}

const FRACS = [[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞'],[1,'']];
function fmtQty(n, metric){
  if (n == null || !isFinite(n)) return '';
  if (metric) { if (n >= 100) return String(Math.round(n / 5) * 5); if (n >= 10) return String(Math.round(n)); return String(Math.round(n * 10) / 10); }
  if (n >= 20) return String(Math.round(n));
  let whole = Math.floor(n + 1e-9); const r = n - whole;
  let best = FRACS[0], d = 9; for (const f of FRACS) { const dd = Math.abs(r - f[0]); if (dd < d) { d = dd; best = f; } }
  if (best[0] === 1) whole += 1;
  const out = (whole ? String(whole) : '') + best[1];
  return out || (n > 0 ? '⅛' : '0');
}
function unitLabel(u, q){ const U = UNIT_BY[u]; if (!U) return u || ''; return (q != null && q > 1.01) ? U[4] : U[3]; }
const METRIC_UNITS = ['ml','l','g','kg'];
// convert {qty, qty2, unit} to the requested system; returns new {qty, qty2, unit}
function convert(p, sys){
  const U = UNIT_BY[p.unit]; if (!U || U[1] === 'cnt' || sys === 'original' || p.qty == null) return p;
  const isMetric = METRIC_UNITS.includes(p.unit);
  if ((sys === 'metric' && isMetric) || (sys === 'imperial' && !isMetric)) return p;
  const base = p.qty * U[2], base2 = p.qty2 != null ? p.qty2 * U[2] : null;
  let to;
  if (U[1] === 'vol') to = sys === 'metric' ? (base >= 1000 ? 'l' : 'ml') : (base < 14 ? 'tsp' : base < 59 ? 'tbsp' : 'cup');
  else to = sys === 'metric' ? (base >= 1000 ? 'kg' : 'g') : (base < 453 ? 'oz' : 'lb');
  const T = UNIT_BY[to];
  return { ...p, unit: to, qty: base / T[2], qty2: base2 != null ? base2 / T[2] : null };
}
function ingDisplay(line, factor, sys){
  const p = parseLine(line); if (!p) return null; if (p.heading) return p;
  if (p.qty == null) return { ...p, q: '', rest: p.text };
  if (factor === 1 && sys === 'original') {
    const m = p.text.match(/^[-•*▢□]?\s*([\d½⅓⅔¼¾⅛⅜⅝⅞⅕⅖⅗⅘⅙⅚\s\/.\-–]+(?:to\s+[\d\/.\s]+)?)/);
    const qt = m ? m[0] : '';
    let rest = p.text.slice(qt.length); let q = qt.trim();
    if (p.unit) { const um = rest.match(/^\s*[A-Za-z.]+\.?/); if (um) { q += ' ' + um[0].trim(); rest = rest.slice(um[0].length); } }
    return { ...p, q, rest: rest.trim() };
  }
  const c = convert({ qty: p.qty * factor, qty2: p.qty2 != null ? p.qty2 * factor : null, unit: p.unit }, sys);
  const metric = METRIC_UNITS.includes(c.unit);
  let q = fmtQty(c.qty, metric) + (c.qty2 != null ? '–' + fmtQty(c.qty2, metric) : '');
  if (c.unit) q += ' ' + unitLabel(c.unit, c.qty2 != null ? c.qty2 : c.qty);
  return { ...p, q, rest: p.item + (p.note ? ', ' + p.note : '') };
}

  if (cb === 'none') list = list.filter(r => !(r.cookbookIds || []).length);
  else if (cb === 'notcooked') list = list.filter(r => !(r.cookLog || []).length);

  if (q) list = list.filter(r => [r.title, r.cuisine, (r.tags || []).join(' '), (r.ingredients || []).join(' ')].join(' ').toLowerCase().includes(q));
  const tt = r => (r.prepMin || 0) + (r.cookMin || 0) || 9999;

  h += '</section>';

  'tags: up to 4 short lowercase words such as "dinner", "dessert", "vegetarian", "slow cooker". If there is no recipe in the content, reply {"error":"no recipe found"}.';

function sampleErr(e){
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled') return 'Claude isn’t allowed for this page. Allow it from the page’s permissions to use imports.';
  if (c === 'rate_limited') return 'You’ve hit a usage limit. Try again in a little while.';
  if (c === 'invalid_json' || c === 'empty_completion') return 'Claude’s answer didn’t come back in a usable form. Tap Import to try again.';
  if (c === 'image_rejected') return 'One of the images couldn’t be read. Try a JPG or PNG under 20 MB.';
  if (c === 'prompt_too_large') return 'That’s too much text. Paste just the recipe part.';
  if (c === 'refused') return 'Claude couldn’t process that content. Try pasting just the recipe.';

/* ---------------- grocery logic ---------------- */
async function addGroceryLines(entries){
  // entries: [{line, factor, recipe:{id,title}|null, sys}]
  const changed = {}; const created = [];
  const pool = S.groceries.filter(g => !g.checked).map(g => clone(g));
  for (const e of entries) {
    const p = parseLine(e.line); if (!p || p.heading) continue;
    let qty = p.qty != null ? p.qty * (e.factor || 1) : null; let unit = p.unit || null;
    const name = cleanName(p.item || p.text); const key = itemKey(name);
    if (!key) continue;
    const U = UNIT_BY[unit];
    let target = pool.find(g => g.key === key && (g.unit === unit || (U && UNIT_BY[g.unit] && UNIT_BY[g.unit][1] === U[1] && U[1] !== 'cnt') || (g.qty == null && qty == null)));
    if (target) {
      if (qty != null && target.qty != null) {
        if (target.unit === unit) target.qty += qty;
        else { target.qty += qty * U[2] / UNIT_BY[target.unit][2]; }
      } else if (qty != null && target.qty == null) { target.qty = qty; target.unit = unit; }
      if (e.recipe && !(target.recipes || []).some(x => x.id === e.recipe.id)) target.recipes = (target.recipes || []).concat([e.recipe]);
      changed[target.id] = target;
    } else {
      const g = { id: uid(), name: name.charAt(0).toUpperCase() + name.slice(1), key, qty, unit, aisle: guessAisle(name), checked: false, note: '', recipes: e.recipe ? [e.recipe] : [], createdAt: Date.now() + created.length };
      pool.push(g); created.push(g); changed[g.id] = g;
    }
  }
  const ids = Object.keys(changed);
  await Promise.all(ids.map(id => put('groceries', id, strip(changed[id]))));
  return ids.length;
}

    try {
      const convo = c.turns.map(t => (t.role === 'user' ? 'Cook: ' : 'Helper: ') + t.content).join('\n');
      const j = await SAMPLE.json('Rewrite this recipe with the changes agreed in the conversation. Keep everything else the same.\n\nOriginal recipe:\n' + recipeText(r) + '\n\nConversation:\n' + convo + '\n\n' + IMPORT_RULES.split('\n').slice(1, 3).join('\n') + '\nReply with only JSON: {"title":string,"description":string|null,"servings":number|null,"prepMinutes":number|null,"cookMinutes":number|null,"cuisine":string|null,"tags":[string],"ingredients":[string],"steps":[string],"notes":string|null}');
      c.saving = false; const rec = aiToRecipe(j, r.sourceUrl); if (!rec.title) rec.title = r.title; if (rec.title === r.title) rec.title = r.title + ' (my version)'; rec.cookbookIds = (r.cookbookIds || []).slice();
      S.ov.pop(); openEditor(rec, { imported: true, imageId: r.imageId || null });
    } catch (e) { c.saving = false; c.error = sampleErr(e); render(); }
  },
  // settings
  async setFirstDay(d){ try { await put('settings', 'main', Object.assign(strip(S.settings), { firstDay: +d.v })); } catch (e) {} },
  backup(){ copyText(JSON.stringify({ exported: new Date().toISOString(), cookbooks: S.cookbooks, recipes: S.recipes }, null, 2)); },
};
async function addPlan(recipeId, note){
  const date = dv('pa-date', top().date || dkey(new Date())); const meal = dv('pa-meal', 'dinner');
  if (!/^\d{4}-\d\d-\d\d$/.test(date)) { toast('Pick a day.'); return; }
  try { await put('plan', uid(), { date, meal, recipeId: recipeId || null, note: note || '', createdAt: Date.now() }); S.ov.pop(); clearDrafts('pa-'); const d = parseKey(date); toast('Added to ' + DOW[d.getDay()] + ' ' + mealLabel(meal).toLowerCase()); render(); } catch (e) {}
}
function copyText(t){
  try { navigator.clipboard.writeText(t).then(() => toast('Copied'), () => fallbackCopy(t)); } catch (e) { fallbackCopy(t); }
}
function fallbackCopy(t){ const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Couldn’t copy. Select the text and copy it yourself.'); } ta.remove(); }
function shrink(file){
  return new Promise(res => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const max = 1600; let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); c.toBlob(b => res(b || file), 'image/jpeg', 0.85); };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

/* ---------------- events ---------------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'file')) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'backdrop') { fn(el.dataset, el, ev); return; }
  ev.preventDefault(); fn(el.dataset, el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.id || el.type === 'file') return;
  S.drafts[el.id] = el.value;
  if (el.hasAttribute('data-live')) render();
});
document.addEventListener('change', ev => {
  const el = ev.target; if (el.id && el.type !== 'file') S.drafts[el.id] = el.value;
  const a = el.dataset.actChange; if (a && A[a]) A[a](el.dataset, el, ev);
});
document.addEventListener('keydown', ev => {
  const el = ev.target;
  if (ev.key === 'Enter' && el.dataset && el.dataset.enter && !ev.shiftKey) { ev.preventDefault(); A[el.dataset.enter](); }
  if (ev.key === 'Enter' && el.id === 'gAdd' && !ev.shiftKey && !/\n/.test(el.value)) { ev.preventDefault(); A.gAdd(); }
  if (ev.key === 'Escape' && S.ov.length) A.close();
  const o = top();
  if (o && o.type === 'cook' && !o.showIngs && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && el.tagName !== 'INPUT') A.cookStep({ v: ev.key === 'ArrowRight' ? 1 : -1 });
});
document.addEventListener('paste', ev => {
  const o = top(); if (!o || o.type !== 'import' || o.mode !== 'photo') return;
  const files = Array.from((ev.clipboardData && ev.clipboardData.files) || []).filter(f => /^image\//.test(f.type));
  if (files.length) { ev.preventDefault(); o.files = (o.files || []).concat(files).slice(0, o.max || 5); o.error = ''; render(); }
});
document.addEventListener('visibilitychange', () => { const o = top(); if (document.visibilityState === 'visible' && o && o.type === 'cook') wake(true); });

/* ---------------- sync + boot ---------------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Installed. Look for Pickett Pantry in your Share menu.'); render(); });
document.addEventListener('submit', ev => { if (ev.target.dataset.form === 'login') { ev.preventDefault(); A.emailIn(); } });

async function loadAll(){
  const j = await api('data');
  S.recipes = j.recipes || []; S.cookbooks = j.cookbooks || []; S.plan = j.plan || []; S.groceries = j.groceries || []; S.settings = j.settings || {};
  S.rev = j.rev; Object.keys(S.loaded).forEach(k => { S.loaded[k] = true; }); saveCache(); render();
}
let syncing = false, pollT = null;
async function poll(){
  if (syncing || S.auth !== 'ok' || document.visibilityState !== 'visible') return;
  syncing = true;
  try { const j = await api('rev'); if (j.rev !== S.rev) await loadAll(); } catch (e) {}
  syncing = false;
}
async function startSync(){
  const cache = lsGet('cache', null);
  if (cache && cache.recipes && S.me && cache.uid === S.me.user.uid) { Object.assign(S, { recipes: cache.recipes, cookbooks: cache.cookbooks || [], plan: cache.plan || [], groceries: cache.groceries || [], settings: cache.settings || {} }); Object.keys(S.loaded).forEach(k => { S.loaded[k] = true; }); render(); }
  try { await loadAll(); } catch (e) { if (e && e.code === 'auth') return; }
  clearInterval(pollT); pollT = setInterval(poll, 15000);
  await handlePending();
  await handleShare();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });

async function readShareInbox(){
  if (!('caches' in window)) return null;
  try {
    const c = await caches.open('pp-share'); const m = await c.match('/share-inbox/meta'); if (!m) return null;
    const meta = await m.json(); const files = [];
    for (const k of meta.files || []) { const r = await c.match(k); if (r) { const b = await r.blob(); files.push(new File([b], 'shared-' + files.length + '.jpg', { type: b.type || 'image/jpeg' })); } await c.delete(k); }
    await c.delete('/share-inbox/meta');
    return { title: meta.title || '', text: meta.text || '', url: meta.url || '', files };
  } catch (e) { return null; }
}
async function handleShare(){
  const q = new URLSearchParams(location.search);
  let shared = null;
  if (q.has('shared')) shared = await readShareInbox();
  if (!shared && (q.get('url') || q.get('text'))) shared = { title: q.get('title') || '', text: q.get('text') || '', url: q.get('url') || '', files: [] };
  if (q.has('shared') || q.has('url') || q.has('text')) history.replaceState(null, '', '/');
  if (!shared) return;
  if (!shared.url) shared.url = (String(shared.text).match(/https?:\/\/[^\s<>"']+/) || [''])[0].replace(/[).,]+$/, '');
  if (!shared.url && !(shared.files || []).length && String(shared.text).trim().length < 20) { toast('Nothing to import in what was shared.'); return; }
  S.ov = [{ type: 'import', mode: 'share', shared, files: shared.files }];
  render();
  A.runImport();
}

function authErr(e){
  const c = (e && e.code) || '';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials') return 'That email and password don’t match. Try again, or tap Forgot password.';
  if (c === 'auth/email-already-in-use') return 'There’s already an account with that email. Sign in instead.';
  if (c === 'auth/weak-password') return 'Pick a longer password (at least 6 characters).';
  if (c === 'auth/invalid-email') return 'That email address doesn’t look right.';
  if (c === 'auth/too-many-requests') return 'Too many tries. Wait a few minutes and try again.';
  if (c === 'auth/network-request-failed') return 'No connection. Check your internet and try again.';
  if (c === 'auth/unauthorized-domain') return 'This web address isn’t allowed in Firebase yet. Add it under Authentication, Settings, Authorized domains.';
  if (c === 'auth/operation-not-allowed') return 'That sign-in method isn’t switched on in Firebase yet.';
  return 'Couldn’t sign in. Try again.';
}
async function loadMe(){ try { S.me = await api('me'); render(); } catch (e) {} }
let signedInUid = null;
async function signedIn(user){
  if (signedInUid === user.uid) return;
  signedInUid = user.uid; S.auth = 'ok'; S.pendingNote = ''; render();
  await loadMe();
  await startSync();
}
// links like ?join=CODE or ?recipe=ID survive the sign-in step
const PENDING = (() => {
  const q = new URLSearchParams(location.search); const p = {};
  if (q.get('join')) p.join = q.get('join'); if (q.get('recipe')) p.recipe = q.get('recipe');
  if (p.join || p.recipe) { try { sessionStorage.setItem('pp_pending', JSON.stringify(p)); } catch (e) {} history.replaceState(null, '', '/' + (q.has('shared') ? '?shared=1' : '')); return p; }
  try { return JSON.parse(sessionStorage.getItem('pp_pending') || 'null') || {}; } catch (e) { return {}; }
})();
async function handlePending(){
  const p = Object.assign({}, PENDING); Object.keys(PENDING).forEach(k => delete PENDING[k]);
  try { sessionStorage.removeItem('pp_pending'); } catch (e) {}
  if (p.join) {
    try { const j = await api('kitchen/invite/' + encodeURIComponent(p.join)); if (j.already) toast('You’re already in ' + j.kitchenName); else { S.ov.push({ type: 'join', code: p.join, kitchenName: j.kitchenName, ownerName: j.ownerName }); render(); } }
    catch (e) { toast(e.message || 'That invite link didn’t work.'); }
  }
  if (p.recipe) {
    try { const j = await api('share/' + encodeURIComponent(p.recipe), { noAuth: true }); S.ov.push({ type: 'sharedRecipe', recipe: j.recipe, from: j.from }); render(); }
    catch (e) { toast(e.message || 'That recipe link didn’t work.'); }
  }
}

(async function boot(){
  if ('serviceWorker' in navigator) { try { await navigator.serviceWorker.register('/sw.js'); } catch (e) {} }
  if (PENDING.join) S.pendingNote = 'Sign in or create an account to join the kitchen you were invited to.';
  else if (PENDING.recipe) S.pendingNote = 'Sign in or create an account to save the recipe someone sent you.';
  const cfg = window.FIREBASE_CONFIG || {};
  if (!cfg.apiKey || /REPLACE/.test(cfg.apiKey)) { S.auth = 'unconfigured'; render(); return; }
  try {
    const { auth, mod } = await loadFirebase();
    mod.getRedirectResult(auth).catch(e => { S.loginErr = authErr(e); render(); });
    mod.onAuthStateChanged(auth, user => {
      if (user) signedIn(user);
      else { signedInUid = null; S.auth = 'login'; render(); }
    });
  } catch (e) { S.auth = 'login'; S.loginErr = 'Couldn’t load sign-in. Check your connection and reload.'; render(); }
})();
})();
</script>
